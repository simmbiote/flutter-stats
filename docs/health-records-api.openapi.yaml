openapi: 3.0.3
info:
  title: Flutter Stats Health Records API
  version: 1.0.0
  description: |
    Receiving API for Health Connect synchronization records.

    The Flutter client sends one operation per POST in its current implementation.
    The schema accepts 1–100 records so the endpoint can support deterministic
    batching later without changing the URL or authentication contract.

    The current client sends an upsert record's source as a string. A source
    object is also accepted for compatibility with the richer API contract.
    The current client emits the category value `bodyMeasurements`; `body` is
    accepted as an alias for services that use the shorter contract name.

    Production deployments must use HTTPS. The local mock transport is for
    synthetic data only and must never be used with real Health Connect data.
  contact:
    name: Flutter Stats API team
servers:
  - url: https://api.example.com
    description: Replace with the deployed HTTPS staging or production URL.
tags:
  - name: Health records
    description: Synchronization of Health Connect records and deletions.
paths:
  /v1/health-records:
    post:
      operationId: submitHealthRecords
      tags:
        - Health records
      summary: Submit health-record upserts or deletions
      description: |
        Submits an idempotent upsert or delete operation. Upserts and deletes
        are separate requests. The operation is identified by the
        `Idempotency-Key` header and the mutation identity in the record.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SchemaVersion'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpsertRequest'
                - $ref: '#/components/schemas/DeleteRequest'
              discriminator:
                propertyName: operation
                mapping:
                  upsert: '#/components/schemas/UpsertRequest'
                  delete: '#/components/schemas/DeleteRequest'
            examples:
              stepsUpsert:
                summary: Synthetic steps upsert
                value:
                  schema_version: '1'
                  source_platform: android_health_connect
                  operation: upsert
                  records:
                    - record_id: synthetic-steps-001
                      source_platform: android_health_connect
                      record_type: steps
                      category: activity
                      start_time: '2026-09-24T08:00:00Z'
                      end_time: '2026-09-24T08:15:00Z'
                      source_version: synthetic-v1
                      source: Synthetic Health Source
                      origin: unknown
                      measurement:
                        kind: numeric
                        unit: count
                        value: 1240
              stepsDelete:
                summary: Synthetic steps delete
                value:
                  schema_version: '1'
                  source_platform: android_health_connect
                  operation: delete
                  records:
                    - record_id: synthetic-steps-001
                      source_platform: android_health_connect
                      record_type: steps
                      mutation_id: android_health_connect|synthetic-steps-001|steps|delete|deleted
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          $ref: '#/components/responses/Timeout'
        '425':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/Timeout'
        default:
          $ref: '#/components/responses/DefaultError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-installation-credential
      description: |
        Installation credential supplied by the deployment environment. The
        Flutter client reads it from secure device storage and sends it only in
        the Authorization header.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Stable client-generated operation identity. Repeating the same key with
        the same body must return the original result. Reusing a key with a
        different body is a contract error.
      schema:
        type: string
        minLength: 1
        maxLength: 512
      example: android_health_connect|synthetic-steps-001|steps|upsert|synthetic-v1
    SchemaVersion:
      name: X-Schema-Version
      in: header
      required: true
      description: Wire schema version.
      schema:
        type: string
        enum:
          - '1'
      example: '1'
    ClientVersion:
      name: X-Client-Version
      in: header
      required: true
      description: Version of the Flutter client making the request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: 1.0.0
  headers:
    RetryAfter:
      description: Optional HTTP retry delay in seconds.
      schema:
        type: integer
        minimum: 0
  schemas:
    UpsertRequest:
      type: object
      required:
        - schema_version
        - source_platform
        - operation
        - records
      additionalProperties: false
      properties:
        schema_version:
          $ref: '#/components/schemas/SchemaVersion'
        source_platform:
          $ref: '#/components/schemas/SourcePlatform'
        operation:
          type: string
          enum:
            - upsert
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/UpsertRecord'
    DeleteRequest:
      type: object
      required:
        - schema_version
        - source_platform
        - operation
        - records
      additionalProperties: false
      properties:
        schema_version:
          $ref: '#/components/schemas/SchemaVersion'
        source_platform:
          $ref: '#/components/schemas/SourcePlatform'
        operation:
          type: string
          enum:
            - delete
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DeleteRecord'
    SchemaVersion:
      type: string
      enum:
        - '1'
      description: Wire schema version.
    SourcePlatform:
      type: string
      description: Canonical platform that produced the record.
      example: android_health_connect
    UpsertRecord:
      type: object
      required:
        - record_id
        - source_platform
        - record_type
        - category
        - start_time
        - end_time
        - source_version
        - source
        - measurement
      additionalProperties: false
      properties:
        record_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque, stable source record identity.
        mutation_id:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Optional stable mutation identity. The current Flutter client uses
            the Idempotency-Key header for this purpose and does not require
            this field on upserts.
        source_platform:
          $ref: '#/components/schemas/SourcePlatform'
        record_type:
          type: string
          minLength: 1
          maxLength: 128
          description: Canonical Health Connect record type.
          example: steps
        category:
          type: string
          description: |
            Record category. `bodyMeasurements` is emitted by the current
            Flutter client; `body` is accepted as a compatibility alias.
          enum:
            - activity
            - vitals
            - sleep
            - bodyMeasurements
            - body
        lifecycle:
          type: string
          enum:
            - active
            - corrected
          description: Optional record lifecycle marker.
        source_version:
          type: string
          minLength: 1
          maxLength: 512
          description: Provider version or content version used for conflict resolution.
        start_time:
          type: string
          format: date-time
          description: Start time in UTC.
        end_time:
          type: string
          format: date-time
          description: End time in UTC.
        start_offset:
          type: string
          pattern: '^[+-][0-9]{2}:[0-9]{2}$'
          description: Optional original UTC offset for the start time.
          example: +02:00
        end_offset:
          type: string
          pattern: '^[+-][0-9]{2}:[0-9]{2}$'
          description: Optional original UTC offset for the end time.
          example: +02:00
        source:
          description: |
            Source display information. The current Flutter client sends a
            string; the object form supports the richer contract.
          oneOf:
            - type: string
              minLength: 1
            - $ref: '#/components/schemas/SourceMetadata'
        known_origin:
          type: string
          enum:
            - samsung_health
            - health_connect
            - unknown
          description: Known source origin when available.
        received_at:
          type: string
          format: date-time
          description: Optional time at which the client received the record.
        measurement:
          $ref: '#/components/schemas/Measurement'
        metadata:
          type: object
          additionalProperties: true
          description: Optional source-specific metadata. Credentials are forbidden.
    DeleteRecord:
      type: object
      required:
        - record_id
        - source_platform
        - record_type
        - mutation_id
      additionalProperties: false
      properties:
        record_id:
          type: string
          minLength: 1
          maxLength: 512
        source_platform:
          $ref: '#/components/schemas/SourcePlatform'
        record_type:
          type: string
          minLength: 1
          maxLength: 128
        mutation_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Stable delete operation identity.
        category:
          type: string
          enum:
            - activity
            - vitals
            - sleep
            - bodyMeasurements
            - body
          description: Optional category retained by richer contract implementations.
        source_version:
          type: string
          maxLength: 512
          description: Optional last-known provider version.
    SourceMetadata:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: Human-readable source label.
        package_name:
          type: string
          description: Optional source application package name.
        device:
          type: string
          description: Optional safe device label.
    Measurement:
      type: object
      required:
        - kind
        - unit
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
          description: Measurement representation, such as numeric or session.
          example: numeric
        unit:
          type: string
          description: Source or canonical unit.
          example: count
        value:
          type: number
          format: double
          nullable: true
          description: Numeric value when present.
        attributes:
          type: object
          additionalProperties: true
          description: Optional non-standard measurement attributes.
    Acknowledgement:
      type: object
      required:
        - status
        - accepted
      additionalProperties: true
      properties:
        operation_id:
          type: string
          description: Server or client operation identifier.
        status:
          type: string
          enum:
            - accepted
            - rejected
        accepted:
          type: boolean
          description: Whether the operation was accepted.
        accepted_record_ids:
          type: array
          items:
            type: string
          description: Record IDs accepted by the service.
        rejected_record_ids:
          type: array
          items:
            type: string
          description: Record IDs rejected by the service.
        record_ids:
          type: array
          items:
            type: string
          description: Legacy alias for accepted record IDs.
        retry_after_seconds:
          type: integer
          minimum: 0
          description: Optional retry delay for rate limiting.
        error_code:
          type: string
          description: Optional machine-readable error code.
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      additionalProperties: true
      properties:
        error_code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
  responses:
    Accepted:
      description: Operation accepted. The client removes acknowledged local payloads.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Acknowledgement'
          examples:
            accepted:
              value:
                operation_id: android_health_connect|synthetic-steps-001|steps|upsert|synthetic-v1
                status: accepted
                accepted: true
                accepted_record_ids:
                  - synthetic-steps-001
                rejected_record_ids: []
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid installation credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Credential is not authorized for this installation or operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Timeout:
      description: The service timed out while processing the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: The request was well-formed but could not be processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests or the service is temporarily rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Temporary server or upstream failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DefaultError:
      description: Unexpected service error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
